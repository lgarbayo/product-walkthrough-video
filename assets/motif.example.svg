  <rect style="fill:var(--pill-ink);stroke:var(--ink)" x="346" y="226" width="28" height="28" stroke-width="3" data-pop data-at="1.6"/>
  <rect style="fill:var(--accent-fail)" x="506" y="186" width="28" height="28" data-pop data-at="1.9"/>
  <rect style="fill:var(--accent-pass)" x="746" y="186" width="28" height="28" data-pop data-at="2.2"/>
